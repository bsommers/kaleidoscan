<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="1000" height="360" role="img" aria-labelledby="t d"><title id="t">ranking and scoring explainer</title><desc id="d">Noisy-OR combination of independent scanner precisions with a worked example</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#38bdf8"/></marker><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#050811"/><stop offset="1" stop-color="#0a0f1d"/></linearGradient></defs><rect width="1000" height="360" fill="url(#bg)"/><pattern id="g" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#00e5ff" stroke-opacity="0.12" stroke-width="1"/></pattern><rect width="1000" height="360" fill="url(#g)"/><text x="24" y="30" font-family="ui-monospace, 'Cascadia Code', 'Fira Code', Menlo, Consolas, monospace" font-size="15" font-weight="700" fill="#00e5ff" text-anchor="start">FINDING SCORE  (noisy-OR over independent scanners)</text><rect x="24" y="50" width="952" height="70" rx="8" fill="#0b1326" fill-opacity="0.92" stroke="#00e5ff" stroke-width="1.5"/><text x="36" y="70" font-family="ui-monospace, 'Cascadia Code', 'Fira Code', Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#f0f6fc" text-anchor="start">p_tp = 1 - PROD_i (1 - precision_i[lang, cwe])</text><text x="36" y="90" font-family="ui-monospace, 'Cascadia Code', 'Fira Code', Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#00e5ff" text-anchor="start">scanners sharing an independence_group count once; unscored scanners use neutral prior 0.30 (flagged)</text><rect x="24" y="140" width="300" height="90" rx="8" fill="#0b1326" fill-opacity="0.92" stroke="#38bdf8" stroke-width="1.5"/><text x="36" y="160" font-family="ui-monospace, 'Cascadia Code', 'Fira Code', Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="#f0f6fc" text-anchor="start">scanner A  precision 0.769</text><text x="36" y="180" font-family="ui-monospace, 'Cascadia Code', 'Fira Code', Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#00e5ff" text-anchor="start">(Flowscope Python, gate 2026-09-13)</text><rect x="24" y="250" width="300" height="90" rx="8" fill="#0b1326" fill-opacity="0.92" stroke="#38bdf8" stroke-width="1.5"/><text x="36" y="270" font-family="ui-monospace, 'Cascadia Code', 'Fira Code', Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="#f0f6fc" text-anchor="start">scanner B  precision 0.500</text><text x="36" y="290" font-family="ui-monospace, 'Cascadia Code', 'Fira Code', Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#00e5ff" text-anchor="start">illustrative value, not measured</text><line x1="324" y1="185" x2="440" y2="240" stroke="#38bdf8" stroke-width="2" marker-end="url(#ah)"/><line x1="324" y1="295" x2="440" y2="270" stroke="#38bdf8" stroke-width="2" marker-end="url(#ah)"/><rect x="440" y="200" width="536" height="110" rx="8" fill="#0b1326" fill-opacity="0.92" stroke="#00ff9d" stroke-width="1.5"/><text x="452" y="220" font-family="ui-monospace, 'Cascadia Code', 'Fira Code', Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#f0f6fc" text-anchor="start">p_tp = 1 - (1-0.769) x (1-0.5) = 0.885</text><text x="452" y="240" font-family="ui-monospace, 'Cascadia Code', 'Fira Code', Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#00e5ff" text-anchor="start">two independent reports raise confidence from 0.769 to 0.885</text><text x="452" y="257" font-family="ui-monospace, 'Cascadia Code', 'Fira Code', Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="start">ranked view orders by p_tp and prints this explanation</text></svg>
