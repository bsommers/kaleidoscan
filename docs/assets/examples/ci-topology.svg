<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 320" width="1100" height="320" role="img" aria-labelledby="t d"><title id="t">CI topology</title><desc id="d">Local runner and GitHub Actions share one code path</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#38bdf8"/></marker><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#050811"/><stop offset="1" stop-color="#0a0f1d"/></linearGradient></defs><rect width="1100" height="320" fill="url(#bg)"/><pattern id="g" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#00e5ff" stroke-opacity="0.12" stroke-width="1"/></pattern><rect width="1100" height="320" fill="url(#g)"/><text x="24" y="30" font-family="ui-monospace, 'Cascadia Code', 'Fira Code', Menlo, Consolas, monospace" font-size="15" font-weight="700" fill="#00e5ff" text-anchor="start">CI TOPOLOGY  (one code path, C10)</text><rect x="24" y="60" width="300" height="90" rx="8" fill="#0b1326" fill-opacity="0.92" stroke="#00e5ff" stroke-width="1.5"/><text x="36" y="80" font-family="ui-monospace, 'Cascadia Code', 'Fira Code', Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#f0f6fc" text-anchor="start">local</text><text x="36" y="100" font-family="ui-monospace, 'Cascadia Code', 'Fira Code', Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#00e5ff" text-anchor="start">scripts/verify.sh</text><text x="36" y="117" font-family="ui-monospace, 'Cascadia Code', 'Fira Code', Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="start">kaleidoscan run --profile ci</text><rect x="24" y="190" width="300" height="90" rx="8" fill="#0b1326" fill-opacity="0.92" stroke="#38bdf8" stroke-width="1.5"/><text x="36" y="210" font-family="ui-monospace, 'Cascadia Code', 'Fira Code', Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#f0f6fc" text-anchor="start">GitHub Actions</text><text x="36" y="230" font-family="ui-monospace, 'Cascadia Code', 'Fira Code', Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#00e5ff" text-anchor="start">action.yml (composite)</text><text x="36" y="247" font-family="ui-monospace, 'Cascadia Code', 'Fira Code', Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="start">pinned SHAs, least privilege</text><line x1="324" y1="105" x2="440" y2="165" stroke="#38bdf8" stroke-width="2" marker-end="url(#ah)"/><line x1="324" y1="235" x2="440" y2="190" stroke="#38bdf8" stroke-width="2" marker-end="url(#ah)"/><rect x="440" y="130" width="280" height="80" rx="8" fill="#0b1326" fill-opacity="0.92" stroke="#00ff9d" stroke-width="1.5"/><text x="452" y="150" font-family="ui-monospace, 'Cascadia Code', 'Fira Code', Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#f0f6fc" text-anchor="start">kaleidoscan run --profile ci</text><text x="452" y="170" font-family="ui-monospace, 'Cascadia Code', 'Fira Code', Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#00e5ff" text-anchor="start">same adapters, no CI-only logic</text><line x1="720" y1="170" x2="780" y2="170" stroke="#38bdf8" stroke-width="2" marker-end="url(#ah)"/><rect x="780" y="90" width="296" height="160" rx="8" fill="#0b1326" fill-opacity="0.92" stroke="#00e5ff" stroke-width="1.5"/><text x="792" y="110" font-family="ui-monospace, 'Cascadia Code', 'Fira Code', Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#f0f6fc" text-anchor="start">outputs</text><text x="792" y="130" font-family="ui-monospace, 'Cascadia Code', 'Fira Code', Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#00e5ff" text-anchor="start">results.sarif -&gt; code scanning</text><text x="792" y="147" font-family="ui-monospace, 'Cascadia Code', 'Fira Code', Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="start">report.html -&gt; artifact</text><text x="792" y="164" font-family="ui-monospace, 'Cascadia Code', 'Fira Code', Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="start">PR runs: diff vs base baseline</text><text x="792" y="181" font-family="ui-monospace, 'Cascadia Code', 'Fira Code', Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="start">exit code 0..4 = gate</text></svg>
