<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 300" width="1100" height="300" role="img" aria-labelledby="t d"><title id="t">MCP forge pipeline</title><desc id="d">OpenAPI to MCP Forge to FastMCP server to client</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#38bdf8"/></marker><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#050811"/><stop offset="1" stop-color="#0a0f1d"/></linearGradient></defs><rect width="1100" height="300" fill="url(#bg)"/><pattern id="g" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#00e5ff" stroke-opacity="0.12" stroke-width="1"/></pattern><rect width="1100" height="300" fill="url(#g)"/><text x="24" y="30" font-family="ui-monospace, 'Cascadia Code', 'Fira Code', Menlo, Consolas, monospace" font-size="15" font-weight="700" fill="#00e5ff" text-anchor="start">MCP VIA FORGE  (Task 11, planned)</text><rect x="24" y="60" width="230" height="80" rx="8" fill="#0b1326" fill-opacity="0.92" stroke="#00e5ff" stroke-width="1.5"/><text x="36" y="80" font-family="ui-monospace, 'Cascadia Code', 'Fira Code', Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#f0f6fc" text-anchor="start">openapi.yaml</text><text x="36" y="100" font-family="ui-monospace, 'Cascadia Code', 'Fira Code', Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#00e5ff" text-anchor="start">&lt;=15 ops (C7)</text><line x1="254" y1="100" x2="294" y2="100" stroke="#38bdf8" stroke-width="2" marker-end="url(#ah)"/><rect x="294" y="60" width="230" height="80" rx="8" fill="#0b1326" fill-opacity="0.92" stroke="#00e5ff" stroke-width="1.5"/><text x="306" y="80" font-family="ui-monospace, 'Cascadia Code', 'Fira Code', Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#f0f6fc" text-anchor="start">forge create</text><text x="306" y="100" font-family="ui-monospace, 'Cascadia Code', 'Fira Code', Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#00e5ff" text-anchor="start">dry-run, then --execute</text><line x1="524" y1="100" x2="564" y2="100" stroke="#38bdf8" stroke-width="2" marker-end="url(#ah)"/><rect x="564" y="60" width="230" height="80" rx="8" fill="#0b1326" fill-opacity="0.92" stroke="#00e5ff" stroke-width="1.5"/><text x="576" y="80" font-family="ui-monospace, 'Cascadia Code', 'Fira Code', Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#f0f6fc" text-anchor="start">mcp/ server</text><text x="576" y="100" font-family="ui-monospace, 'Cascadia Code', 'Fira Code', Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#00e5ff" text-anchor="start">FastMCP, mcp&lt;2</text><line x1="794" y1="100" x2="834" y2="100" stroke="#38bdf8" stroke-width="2" marker-end="url(#ah)"/><rect x="834" y="60" width="230" height="80" rx="8" fill="#0b1326" fill-opacity="0.92" stroke="#00e5ff" stroke-width="1.5"/><text x="846" y="80" font-family="ui-monospace, 'Cascadia Code', 'Fira Code', Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#f0f6fc" text-anchor="start">client</text><text x="846" y="100" font-family="ui-monospace, 'Cascadia Code', 'Fira Code', Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#00e5ff" text-anchor="start">Claude / IDE agent</text><text x="24" y="180" font-family="ui-monospace, 'Cascadia Code', 'Fira Code', Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#38bdf8" text-anchor="start">tools (C8): list_scanners | run_scan | get_run | query_findings</text><text x="24" y="202" font-family="ui-monospace, 'Cascadia Code', 'Fira Code', Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#38bdf8" text-anchor="start">             get_report | diff_runs | get_gate</text><text x="24" y="240" font-family="ui-monospace, 'Cascadia Code', 'Fira Code', Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="start">run_scan returns run_id immediately; target must be under KALEIDOSCAN_ALLOWED_ROOTS</text><text x="24" y="262" font-family="ui-monospace, 'Cascadia Code', 'Fira Code', Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="start">validated by forge validate-mcp.sh + T-MCP handshake test</text></svg>
