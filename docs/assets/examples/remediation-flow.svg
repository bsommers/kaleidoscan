<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 400" width="1100" height="400" role="img" aria-labelledby="t d"><title id="t">remediation flow</title><desc id="d">Scan, review, plan, remediate with verify and revert loop, then human-gated pull request</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#38bdf8"/></marker><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#050811"/><stop offset="1" stop-color="#0a0f1d"/></linearGradient></defs><rect width="1100" height="400" fill="url(#bg)"/><pattern id="g" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#00e5ff" stroke-opacity="0.12" stroke-width="1"/></pattern><rect width="1100" height="400" fill="url(#g)"/><text x="24" y="30" font-family="ui-monospace, 'Cascadia Code', 'Fira Code', Menlo, Consolas, monospace" font-size="15" font-weight="700" fill="#00e5ff" text-anchor="start">REMEDIATION FLOW  (human gate before any publish)</text><rect x="24" y="60" width="190" height="80" rx="8" fill="#0b1326" fill-opacity="0.92" stroke="#00e5ff" stroke-width="1.5"/><text x="36" y="80" font-family="ui-monospace, 'Cascadia Code', 'Fira Code', Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="#f0f6fc" text-anchor="start">kaleidoscan run</text><text x="36" y="100" font-family="ui-monospace, 'Cascadia Code', 'Fira Code', Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#00e5ff" text-anchor="start">run -&gt; summary.json</text><line x1="214" y1="100" x2="238" y2="100" stroke="#38bdf8" stroke-width="2" marker-end="url(#ah)"/><rect x="238" y="60" width="190" height="80" rx="8" fill="#0b1326" fill-opacity="0.92" stroke="#00e5ff" stroke-width="1.5"/><text x="250" y="80" font-family="ui-monospace, 'Cascadia Code', 'Fira Code', Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="#f0f6fc" text-anchor="start">kaleidoscan review</text><text x="250" y="100" font-family="ui-monospace, 'Cascadia Code', 'Fira Code', Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#00e5ff" text-anchor="start">evidence-validated</text><line x1="428" y1="100" x2="452" y2="100" stroke="#38bdf8" stroke-width="2" marker-end="url(#ah)"/><rect x="452" y="60" width="190" height="80" rx="8" fill="#0b1326" fill-opacity="0.92" stroke="#00e5ff" stroke-width="1.5"/><text x="464" y="80" font-family="ui-monospace, 'Cascadia Code', 'Fira Code', Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="#f0f6fc" text-anchor="start">kaleidoscan plan</text><text x="464" y="100" font-family="ui-monospace, 'Cascadia Code', 'Fira Code', Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#00e5ff" text-anchor="start">det | ai | manual</text><line x1="642" y1="100" x2="666" y2="100" stroke="#38bdf8" stroke-width="2" marker-end="url(#ah)"/><rect x="666" y="60" width="190" height="80" rx="8" fill="#0b1326" fill-opacity="0.92" stroke="#00e5ff" stroke-width="1.5"/><text x="678" y="80" font-family="ui-monospace, 'Cascadia Code', 'Fira Code', Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="#f0f6fc" text-anchor="start">kaleidoscan remediate</text><text x="678" y="100" font-family="ui-monospace, 'Cascadia Code', 'Fira Code', Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#00e5ff" text-anchor="start">isolated worktree</text><line x1="856" y1="100" x2="880" y2="100" stroke="#38bdf8" stroke-width="2" marker-end="url(#ah)"/><rect x="880" y="60" width="190" height="80" rx="8" fill="#0b1326" fill-opacity="0.92" stroke="#ff2a85" stroke-width="1.5"/><text x="892" y="80" font-family="ui-monospace, 'Cascadia Code', 'Fira Code', Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="#f0f6fc" text-anchor="start">kaleidoscan open-pr</text><text x="892" y="100" font-family="ui-monospace, 'Cascadia Code', 'Fira Code', Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#00e5ff" text-anchor="start">dry-run default</text><rect x="666" y="190" width="190" height="120" rx="8" fill="#0b1326" fill-opacity="0.92" stroke="#ffb800" stroke-width="1.5"/><text x="678" y="210" font-family="ui-monospace, 'Cascadia Code', 'Fira Code', Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="#f0f6fc" text-anchor="start">per-patch loop</text><text x="678" y="230" font-family="ui-monospace, 'Cascadia Code', 'Fira Code', Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#00e5ff" text-anchor="start">apply patch</text><text x="678" y="246" font-family="ui-monospace, 'Cascadia Code', 'Fira Code', Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#94a3b8" text-anchor="start">re-run tests + scan</text><text x="678" y="262" font-family="ui-monospace, 'Cascadia Code', 'Fira Code', Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#94a3b8" text-anchor="start">fail or new finding:</text><text x="678" y="278" font-family="ui-monospace, 'Cascadia Code', 'Fira Code', Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#94a3b8" text-anchor="start">revert + downgrade to</text><text x="678" y="294" font-family="ui-monospace, 'Cascadia Code', 'Fira Code', Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#94a3b8" text-anchor="start">manual</text><line x1="761" y1="140" x2="761" y2="190" stroke="#38bdf8" stroke-width="2" marker-end="url(#ah)"/><rect x="24" y="190" width="400" height="120" rx="8" fill="#0b1326" fill-opacity="0.92" stroke="#38bdf8" stroke-width="1.5"/><text x="36" y="210" font-family="ui-monospace, 'Cascadia Code', 'Fira Code', Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="#f0f6fc" text-anchor="start">limits and guards</text><text x="36" y="230" font-family="ui-monospace, 'Cascadia Code', 'Fira Code', Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#00e5ff" text-anchor="start">forbidden globs -&gt; manual</text><text x="36" y="246" font-family="ui-monospace, 'Cascadia Code', 'Fira Code', Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#94a3b8" text-anchor="start">diff-size limit; manual never patched</text><text x="36" y="262" font-family="ui-monospace, 'Cascadia Code', 'Fira Code', Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#94a3b8" text-anchor="start">fork PRs refuse apply/push</text><text x="36" y="278" font-family="ui-monospace, 'Cascadia Code', 'Fira Code', Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#94a3b8" text-anchor="start">untrusted PR text cannot alter the plan</text><rect x="880" y="190" width="190" height="120" rx="8" fill="#0b1326" fill-opacity="0.92" stroke="#ff2a85" stroke-width="1.5"/><text x="892" y="210" font-family="ui-monospace, 'Cascadia Code', 'Fira Code', Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="#f0f6fc" text-anchor="start">human gate</text><text x="892" y="230" font-family="ui-monospace, 'Cascadia Code', 'Fira Code', Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#00e5ff" text-anchor="start">--confirm required</text><text x="892" y="246" font-family="ui-monospace, 'Cascadia Code', 'Fira Code', Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#94a3b8" text-anchor="start">to publish a PR</text><text x="892" y="262" font-family="ui-monospace, 'Cascadia Code', 'Fira Code', Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#94a3b8" text-anchor="start">else gh_pr.sh only</text><text x="24" y="350" font-family="ui-monospace, 'Cascadia Code', 'Fira Code', Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="start">tasks R1-R4 (planned); contracts C11-C13</text></svg>
